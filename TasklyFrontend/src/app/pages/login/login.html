<div class="auth-page">
  @if (isLogin) {
    <h1 class="auth-title">Войти</h1>

    <form class="auth-form" (ngSubmit)="onLogin()">
      <label for="login">Логин</label>
      <input id="login" type="text" name="login" placeholder="Введите логин" [(ngModel)]="login" />

      <label for="login-password">Пароль</label>
      <input
        id="login-password"
        type="password"
        name="password"
        placeholder="Введите пароль"
        [(ngModel)]="password"
      />

      <button type="submit">Войти</button>
    </form>

    <p>
      Нет аккаунта?
      <button type="button" class="switch-button" (click)="isLogin = false">Регистрация</button>
    </p>
  } @else {
    <h1 class="auth-title">Регистрация</h1>

    <form class="auth-form" (ngSubmit)="onRegister()">
      <label for="register-login">Логин</label>
      <input
        id="register-login"
        type="text"
        name="registerLogin"
        placeholder="Придумайте логин"
        [(ngModel)]="registerLogin"
      />

      <label for="register-password">Пароль</label>
      <input
        id="register-password"
        type="password"
        name="registerPassword"
        placeholder="Придумайте пароль"
        [(ngModel)]="registerPassword"
      />

      <label for="register-confirm-password"> Подтверждение пароля </label>
      <input
        id="register-confirm-password"
        type="password"
        name="registerConfirmPassword"
        placeholder="Введите пароль снова"
        [(ngModel)]="registerConfirmPassword"
      />

      <button type="submit">Зарегистрироваться</button>
    </form>

    <p>
      Уже есть аккаунт?
      <button type="button" class="switch-button" (click)="isLogin = true">Войти</button>
    </p>
  }
</div>
